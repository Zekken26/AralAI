      - quiz
      - status
      - submitted_attempts
      - title
      - total_attempts
    ClassroomRequest:
      type: object
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 200
        section:
          type: string
          maxLength: 100
        school_year:

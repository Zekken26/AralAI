components:
  schemas:
    AnswerPreview:
      type: object
      properties:
        question:
          type: integer
        selected_choice:
          type: integer
          nullable: true
        numeric_response:
          type: string
          format: decimal
          pattern: ^-?\d{0,10}(?:\.\d{0,10})?$
          nullable: true
        answered_at:
          type: string
          format: date-time
      required:
      - answered_at
      - numeric_response
      - question
      - selected_choice
    AnswerSummary:
      type: object
      properties:
        question:
          type: integer
        prompt:
          type: string
        question_type:
          type: string
        selected_choice:
          type: integer
          nullable: true
        numeric_response:
          type: string
          format: decimal
          pattern: ^-?\d{0,10}(?:\.\d{0,10})?$
          nullable: true
        is_correct:
          type: boolean
        points_awarded:
          type: string
          format: decimal
          pattern: ^-?\d{0,8}(?:\.\d{0,2})?$
        correct_choice:
          type: integer
          nullable: true
        numeric_answer:
          type: string
          format: decimal
          pattern: ^-?\d{0,10}(?:\.\d{0,10})?$
          nullable: true
      required:
      - correct_choice
      - is_correct
      - numeric_answer
      - numeric_response
      - points_awarded
      - prompt
      - question
      - question_type
      - selected_choice
    Attempt:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        quiz:
          type: integer
          readOnly: true
        attempt_number:
          type: integer
          readOnly: true
        status:
          allOf:
          - $ref: '#/components/schemas/AttemptStatusEnum'
          readOnly: true
        started_at:
          type: string
          format: date-time
          readOnly: true
        expires_at:
          type: string
          format: date-time
          readOnly: true
          nullable: true
        submitted_at:
          type: string
          format: date-time
          readOnly: true
          nullable: true
        answers:
          type: array
          items:
            $ref: '#/components/schemas/AnswerPreview'
          readOnly: true
      required:
      - answers
      - attempt_number
      - expires_at
      - id
      - quiz
      - started_at
      - status
      - submitted_at
    AttemptAnalytics:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        student:
          allOf:
          - $ref: '#/components/schemas/UserSummary'
          readOnly: true
        attempt_number:
          type: integer
          readOnly: true
        status:
          allOf:
          - $ref: '#/components/schemas/AttemptStatusEnum'
          readOnly: true
        score:
          type: string
          format: decimal
          pattern: ^-?\d{0,3}(?:\.\d{0,2})?$
          readOnly: true
          nullable: true
        earned_points:
          type: string
          format: decimal
          pattern: ^-?\d{0,8}(?:\.\d{0,2})?$
          readOnly: true
          nullable: true
        maximum_points:
          type: string
          format: decimal
          pattern: ^-?\d{0,8}(?:\.\d{0,2})?$
          readOnly: true
          nullable: true
        passed:
          type: boolean
          readOnly: true
          nullable: true
        started_at:
          type: string
          format: date-time
          readOnly: true
        expires_at:
          type: string
          format: date-time
          readOnly: true
          nullable: true
        submitted_at:
          type: string
          format: date-time
          readOnly: true
          nullable: true
        answers:
          type: array
          items:
            $ref: '#/components/schemas/AnswerSummary'
          readOnly: true
      required:
      - answers
      - attempt_number
      - earned_points
      - expires_at
      - id
      - maximum_points
      - passed
      - score
      - started_at
      - status
      - student
      - submitted_at
    AttemptResult:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        quiz:
          type: integer
          readOnly: true
        quiz_title:
          type: string
          readOnly: true
        attempt_number:
          type: integer
          readOnly: true
        status:
          allOf:
          - $ref: '#/components/schemas/AttemptStatusEnum'
          readOnly: true
        score:
          type: string
          format: decimal
          pattern: ^-?\d{0,3}(?:\.\d{0,2})?$
          readOnly: true
          nullable: true
        earned_points:
          type: string
          format: decimal
          pattern: ^-?\d{0,8}(?:\.\d{0,2})?$
          readOnly: true
          nullable: true
        maximum_points:
          type: string
          format: decimal
          pattern: ^-?\d{0,8}(?:\.\d{0,2})?$
          readOnly: true
          nullable: true
        passed:
          type: boolean
          readOnly: true
          nullable: true
        started_at:
          type: string
          format: date-time
          readOnly: true
        expires_at:
          type: string
          format: date-time
          readOnly: true
          nullable: true
        submitted_at:
          type: string
          format: date-time
          readOnly: true
          nullable: true
        questions:
          type: array
          items:
            $ref: '#/components/schemas/QuestionResultItem'
          readOnly: true
      required:
      - attempt_number
      - earned_points
      - expires_at
      - id
      - maximum_points
      - passed
      - questions
      - quiz
      - quiz_title
      - score
      - started_at
      - status
      - submitted_at
    AttemptStatusEnum:
      enum:
      - IN_PROGRESS
      - SUBMITTED
      - EXPIRED
      type: string
      description: |-
        * `IN_PROGRESS` - In Progress
        * `SUBMITTED` - Submitted
        * `EXPIRED` - Expired
    Classroom:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        name:
          type: string
          maxLength: 200
        section:
          type: string
          maxLength: 100
        school_year:
          type: string
          maxLength: 50
        join_code:
          type: string
          nullable: true
          readOnly: true
        is_active:
          type: boolean
        created_at:
          type: string
          format: date-time
          readOnly: true
        updated_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - created_at

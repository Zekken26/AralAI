          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AttemptAnalytics'
          description: ''
    post:
      operationId: v1_quizzes_attempts_create
      description: Starts an attempt. Rejected with 409 when the quiz is not published/available,
        the student is not enrolled, the attempt limit is reached (QUIZ_ATTEMPT_LIMIT_REACHED)
        or an active attempt already exists (QUIZ_ATTEMPT_ALREADY_ACTIVE).
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        required: true
      tags:
      - v1
      security:
      - jwtAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Attempt'
              examples:
                StartAttempt:
                  value:
                    id: 1
                    quiz: 1
                    attempt_number: 1
                    status: IN_PROGRESS
                    started_at: '2026-08-04T10:00:00Z'
                    expires_at: '2026-08-04T10:15:00Z'
                    submitted_at: null
                    answers: []
                  summary: Start attempt
          description: ''

openapi: 3.0.3
info:
  title: AralAI API
  version: 0.1.0
  description: 'Grade 8 Mathematics learning platform API. Endpoints are role-aware:
    students and teachers see different data. Authenticate with a Bearer access token
    obtained from POST /api/v1/auth/login/.'
paths:
  /api/v1/attempts/{id}/:
    get:
      operationId: v1_attempts_retrieve
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        required: true
      tags:
      - v1
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Attempt'
          description: ''
  /api/v1/attempts/{id}/answers/{question_id}/:
    put:
      operationId: v1_attempts_answers_update
      description: Saves or updates an answer while the attempt is IN_PROGRESS. The
        answer format must match the question type (INVALID_ANSWER_FORMAT) and the
        choice must belong to the question (CHOICE_NOT_IN_QUESTION). Client-supplied
        is_correct/points fields are ignored.
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        required: true
      - in: path
        name: question_id
        schema:
          type: integer
        required: true
      tags:
      - v1
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SaveAnswerRequest'
            examples:
              SaveMultiple-choiceAnswer:
                value:
                  selected_choice: 3
                summary: Save multiple-choice answer
              SaveNumericAnswer:
                value:
                  numeric_response: 4
                summary: Save numeric answer
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/SaveAnswerRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/SaveAnswerRequest'
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SavedAnswer'
          description: ''
  /api/v1/attempts/{id}/results/:
    get:
      operationId: v1_attempts_results_retrieve
      description: Historical result for a submitted attempt, including the student's
        answer, correct answer, explanation, points awarded and total score. Remains
        available even after the quiz window closes or the quiz is archived.
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        required: true
      tags:
      - v1
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AttemptResult'
          description: ''
  /api/v1/attempts/{id}/submit/:
    post:
      operationId: v1_attempts_submit_create
      description: 'Submits the attempt. All scoring is computed server-side: answered
        questions are evaluated, unanswered questions earn zero, the percentage score
        and passed result are persisted. Duplicate submission returns 409 QUIZ_ATTEMPT_ALREADY_SUBMITTED;
        expired attempts return 409 QUIZ_ATTEMPT_EXPIRED.'
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        required: true
      tags:
      - v1
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AttemptResult'
          description: ''
  /api/v1/auth/login/:
    post:
      operationId: v1_auth_login_create
      tags:
      - v1
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TokenObtainPairRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/TokenObtainPairRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/TokenObtainPairRequest'
        required: true
      security:
      - jwtAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenObtainPair'
          description: ''
  /api/v1/auth/logout/:
    post:
      operationId: v1_auth_logout_create
      description: |-
        Takes a token and blacklists it. Must be used with the
        `rest_framework_simplejwt.token_blacklist` app installed.
      tags:
      - v1
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TokenBlacklistRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/TokenBlacklistRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/TokenBlacklistRequest'
        required: true
      security:
      - {}
      responses:
        '200':
          description: No response body
  /api/v1/auth/me/:
    get:
      operationId: v1_auth_me_retrieve
      tags:
      - v1
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
          description: ''
  /api/v1/auth/refresh/:
    post:
      operationId: v1_auth_refresh_create
      description: |-
        Takes a refresh type JSON web token and returns an access type JSON web
        token if the refresh token is valid.
      tags:
      - v1
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TokenRefreshRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/TokenRefreshRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/TokenRefreshRequest'
        required: true
      security:
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenRefresh'
          description: ''
  /api/v1/auth/register/:
    post:
      operationId: v1_auth_register_create
      tags:
      - v1
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/RegisterRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/RegisterRequest'
        required: true
      security:
      - jwtAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Register'
          description: ''
  /api/v1/choices/{id}/:
    patch:
      operationId: v1_choices_partial_update
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        required: true
      tags:
      - v1
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchedChoiceWriteRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PatchedChoiceWriteRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PatchedChoiceWriteRequest'
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TeacherChoice'
          description: ''
    delete:
      operationId: v1_choices_destroy
      description: Deleting a choice is blocked when it would invalidate an approved
        question or a published quiz (CHOICE_DELETE_BLOCKED).
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        required: true
      tags:
      - v1
      security:
      - jwtAuth: []
      responses:
        '204':
          description: No response body
  /api/v1/classrooms/:
    get:
      operationId: v1_classrooms_list
      parameters:
      - name: page
        required: false
        in: query
        description: A page number within the paginated result set.
        schema:
          type: integer
      tags:
      - v1
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedClassroomList'
          description: ''
    post:
      operationId: v1_classrooms_create
      tags:
      - v1
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ClassroomRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/ClassroomRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/ClassroomRequest'
        required: true
      security:
      - jwtAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Classroom'
          description: ''
  /api/v1/classrooms/{classroom_id}/progress/:
    get:
      operationId: v1_classrooms_progress_retrieve
      description: Class-wide topic mastery overview for a classroom the teacher owns.
      parameters:
      - in: path
        name: classroom_id
        schema:
          type: integer
        required: true
      tags:
      - v1
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ClassroomProgress'
          description: ''
  /api/v1/classrooms/{classroom_id}/students-needing-support/:
    get:
      operationId: v1_classrooms_students_needing_support_retrieve
      description: Students with at least one topic in NEEDS_SUPPORT status in an
        owned classroom.
      parameters:
      - in: path
        name: classroom_id
        schema:
          type: integer
        required: true
      tags:
      - v1
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StudentsNeedingSupport'
          description: ''
  /api/v1/classrooms/{classroom_id}/students/{student_id}/progress/:
    get:
      operationId: v1_classrooms_students_progress_retrieve
      description: One enrolled student's mastery over the topics taught in an owned
        classroom.
      parameters:
      - in: path
        name: classroom_id
        schema:
          type: integer
        required: true
      - in: path
        name: student_id
        schema:
          type: integer
        required: true
      tags:
      - v1
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TeacherStudentProgress'
          description: ''
  /api/v1/classrooms/{classroom_id}/topics/{topic_id}/progress/:
    get:
      operationId: v1_classrooms_topics_progress_retrieve
      description: Per-student mastery breakdown for one topic in an owned classroom.
      parameters:
      - in: path
        name: classroom_id
        schema:
          type: integer
        required: true
      - in: path
        name: topic_id
        schema:
          type: integer
        required: true
      tags:
      - v1
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ClassroomTopicProgress'
          description: ''
  /api/v1/classrooms/{id}/:
    get:
      operationId: v1_classrooms_retrieve
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        required: true
      tags:
      - v1
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Classroom'
          description: ''
    put:
      operationId: v1_classrooms_update
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        required: true
      tags:
      - v1
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ClassroomRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/ClassroomRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/ClassroomRequest'
        required: true
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Classroom'
          description: ''
    patch:
      operationId: v1_classrooms_partial_update
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        required: true
      tags:
      - v1
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchedClassroomUpdateRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PatchedClassroomUpdateRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PatchedClassroomUpdateRequest'
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ClassroomUpdate'
          description: ''
  /api/v1/classrooms/{id}/quiz-results/:
    get:
      operationId: v1_classrooms_quiz_results_list
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        required: true
      - name: page
        required: false
        in: query
        description: A page number within the paginated result set.
        schema:
          type: integer
      tags:
      - v1
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedClassroomQuizResultsList'
          description: ''
  /api/v1/classrooms/{id}/students/:
    get:
      operationId: v1_classrooms_students_list
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        required: true
      - name: page
        required: false
        in: query
        description: A page number within the paginated result set.
        schema:
          type: integer
      tags:
      - v1
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedEnrollmentList'
          description: ''
  /api/v1/classrooms/join/:
    post:
      operationId: v1_classrooms_join_create
      tags:
      - v1
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/JoinClassroomRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/JoinClassroomRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/JoinClassroomRequest'
        required: true
      security:
      - jwtAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/JoinClassroom'
          description: ''
  /api/v1/lessons/:
    get:
      operationId: v1_lessons_list
      parameters:
      - in: query
        name: classroom
        schema:
          type: integer
      - name: page
        required: false
        in: query
        description: A page number within the paginated result set.
        schema:
          type: integer
      - in: query
        name: status
        schema:
          type: string
          enum:
          - ARCHIVED
          - DRAFT
          - PUBLISHED
        description: |-
          * `DRAFT` - Draft
          * `PUBLISHED` - Published
          * `ARCHIVED` - Archived
      - in: query
        name: topic
        schema:
          type: integer
      tags:
      - v1
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedLessonList'
          description: ''
    post:
      operationId: v1_lessons_create
      tags:
      - v1
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LessonRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/LessonRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/LessonRequest'
      security:
      - jwtAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Lesson'
          description: ''
  /api/v1/lessons/{id}/:
    get:
      operationId: v1_lessons_retrieve
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        required: true
      tags:
      - v1
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Lesson'
          description: ''
    patch:
      operationId: v1_lessons_partial_update
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        required: true
      tags:
      - v1
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchedLessonRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PatchedLessonRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PatchedLessonRequest'
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Lesson'
          description: ''
  /api/v1/lessons/{id}/archive/:
    post:
      operationId: v1_lessons_archive_create
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        required: true
      tags:
      - v1
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LessonRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/LessonRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/LessonRequest'
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Lesson'
          description: ''
  /api/v1/lessons/{id}/publish/:
    post:
      operationId: v1_lessons_publish_create
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        required: true
      tags:
      - v1
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LessonRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/LessonRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/LessonRequest'
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Lesson'
          description: ''
  /api/v1/questions/{id}/:
    get:
      operationId: v1_questions_retrieve
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        required: true
      tags:
      - v1
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TeacherQuestion'
          description: ''
    patch:
      operationId: v1_questions_partial_update
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        required: true
      tags:
      - v1
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchedQuestionWriteRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PatchedQuestionWriteRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PatchedQuestionWriteRequest'
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TeacherQuestion'
          description: ''
  /api/v1/questions/{id}/approve/:
    post:
      operationId: v1_questions_approve_create
      description: Approves a question after validating its full configuration.
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        required: true
      tags:
      - v1
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TeacherQuestion'
          description: ''
        '422':
          description: INVALID_QUESTION_CONFIGURATION
  /api/v1/questions/{id}/choices/:
    get:
      operationId: v1_questions_choices_list
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        required: true
      - name: page
        required: false
        in: query
        description: A page number within the paginated result set.
        schema:
          type: integer
      tags:
      - v1
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedTeacherChoiceList'
          description: ''
    post:
      operationId: v1_questions_choices_create
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        required: true
      tags:
      - v1
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TeacherChoiceRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/TeacherChoiceRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/TeacherChoiceRequest'
        required: true
      security:
      - jwtAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TeacherChoice'
          description: ''
  /api/v1/questions/{id}/reject/:
    post:
      operationId: v1_questions_reject_create
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        required: true
      tags:
      - v1
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TeacherQuestionRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/TeacherQuestionRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/TeacherQuestionRequest'
        required: true
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TeacherQuestion'
          description: ''
  /api/v1/quizzes/:
    get:
      operationId: v1_quizzes_list
      description: |-
        List quizzes visible to the caller.

        Teachers see their own drafts, published and archived quizzes. Students only see
        published, currently available quizzes in classrooms where their enrollment is ACTIVE.
      parameters:
      - name: page
        required: false
        in: query
        description: A page number within the paginated result set.
        schema:
          type: integer
      tags:
      - v1
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedTeacherQuizListList'
          description: ''
    post:
      operationId: v1_quizzes_create
      description: |-
        List quizzes visible to the caller.

        Teachers see their own drafts, published and archived quizzes. Students only see
        published, currently available quizzes in classrooms where their enrollment is ACTIVE.
      tags:
      - v1
      security:
      - jwtAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TeacherQuizList'
          description: ''
  /api/v1/quizzes/{id}/:
    get:
      operationId: v1_quizzes_retrieve
      description: |-
        Role-aware quiz detail.

        Teachers receive full configuration (including answer keys). Students receive only
        approved questions without correct choices, numeric answers, tolerance or explanations.
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        required: true
      tags:
      - v1
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TeacherQuizDetail'
          description: ''
    patch:
      operationId: v1_quizzes_partial_update
      description: |-
        Role-aware quiz detail.

        Teachers receive full configuration (including answer keys). Students receive only
        approved questions without correct choices, numeric answers, tolerance or explanations.
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        required: true
      tags:
      - v1
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchedQuizUpdateRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PatchedQuizUpdateRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PatchedQuizUpdateRequest'
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TeacherQuizDetail'
          description: ''
